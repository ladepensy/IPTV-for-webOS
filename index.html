<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <title>Home IPTV</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="player-stage" aria-label="全屏播放器">
        <video id="player" autoplay playsinline></video>
        <div id="player-placeholder" class="player-placeholder">
          <div class="signal-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p id="player-message">正在获取播放列表</p>
          <div id="player-diagnostics" class="player-diagnostics" hidden></div>
        </div>
      </section>

      <div id="ui-layer" class="ui-layer">
        <header class="topbar">
          <div>
            <p class="eyebrow">LG webOS IPTV</p>
            <h1 id="current-title">正在载入频道…</h1>
          </div>
          <div class="topbar-status">
            <span id="clock">--:--</span>
            <span id="connection-state" class="status-pill">连接中</span>
          </div>
        </header>

        <aside id="channel-panel" class="channel-panel" aria-label="频道列表" aria-hidden="true">
          <div class="panel-heading">
            <span>频道</span>
            <span id="channel-count">0</span>
          </div>
          <div id="channel-list" class="channel-list" role="listbox"></div>
        </aside>

        <div class="now-playing">
          <div>
            <p class="eyebrow">正在播放</p>
            <h2 id="now-playing-title">正在载入频道…</h2>
          </div>
          <p id="now-playing-group">按 → 打开频道列表</p>
        </div>

        <footer>
          <span><kbd>→</kbd> 打开频道</span>
          <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
          <span><kbd>OK</kbd> 播放</span>
          <span><kbd>BACK</kbd> 收起/退出</span>
        </footer>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
