<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <title>Home IPTV</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LG webOS IPTV</p>
          <h1 id="current-title">正在载入频道…</h1>
        </div>
        <div class="topbar-status">
          <span id="clock">--:--</span>
          <span id="connection-state" class="status-pill">连接中</span>
        </div>
      </header>

      <section class="content">
        <aside class="channel-panel" aria-label="频道列表">
          <div class="panel-heading">
            <span>频道</span>
            <span id="channel-count">0</span>
          </div>
          <div id="channel-list" class="channel-list" role="listbox"></div>
        </aside>

        <section class="player-panel">
          <video id="player" autoplay playsinline></video>
          <div id="player-placeholder" class="player-placeholder">
            <div class="signal-mark" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <p id="player-message">正在获取播放列表</p>
            <div id="player-diagnostics" class="player-diagnostics" hidden></div>
          </div>
          <div class="now-playing">
            <div>
              <p class="eyebrow">正在播放</p>
              <h2 id="now-playing-title">尚未选择频道</h2>
            </div>
            <p id="now-playing-group">按方向键选择，按 OK 播放</p>
          </div>
        </section>
      </section>

      <footer>
        <span><kbd>↑</kbd><kbd>↓</kbd> 选择频道</span>
        <span><kbd>OK</kbd> 播放</span>
        <span><kbd>BACK</kbd> 返回/退出</span>
      </footer>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
