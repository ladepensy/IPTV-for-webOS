<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <title>Home IPTV</title>
    <link rel="stylesheet" href="styles.css?v=0.2.3" />
    <link rel="stylesheet" href="features/channels/channel-panel.css?v=0.3.0" />
    <link rel="stylesheet" href="features/sources/source-form.css?v=0.1.0" />
  </head>
  <body>
    <main class="app-shell">
      <section class="player-stage" aria-label="全屏播放器">
        <video id="player" autoplay playsinline></video>
        <div id="player-placeholder" class="player-placeholder">
          <div class="signal-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p id="player-message">正在获取播放列表</p>
          <div id="player-diagnostics" class="player-diagnostics" hidden></div>
        </div>
      </section>

      <div id="ui-layer" class="ui-layer">
        <header class="topbar">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <div>
              <p class="eyebrow">Home IPTV</p>
              <h1 id="current-title">正在载入频道…</h1>
            </div>
          </div>
          <div class="topbar-status">
            <span id="connection-state" class="status-pill"><span class="status-dot" aria-hidden="true"></span>连接中</span>
            <span id="clock" class="clock">--:--</span>
          </div>
        </header>

        <aside id="channel-panel" class="channel-panel" aria-label="频道浏览器" aria-hidden="true">
          <div id="channel-browser-track" class="channel-browser-track">
            <section class="channel-column source-column" aria-label="M3U 播放源">
              <div class="column-heading">
                <p class="eyebrow">播放源</p>
                <strong>M3U</strong>
              </div>
              <div id="source-list" class="browser-list" role="listbox"></div>
            </section>

            <section class="channel-column group-column" aria-label="频道分组">
              <div class="column-heading">
                <p class="eyebrow">频道分组</p>
                <strong>选择分组</strong>
              </div>
              <div id="group-list" class="browser-list" role="listbox"></div>
            </section>

            <section class="channel-column channels-column" aria-label="频道">
              <div class="column-heading">
                <div>
                  <p class="eyebrow">频道</p>
                  <strong id="channel-column-title">全部</strong>
                </div>
                <span id="channel-count" class="channel-count">0</span>
              </div>
              <div id="channel-list" class="browser-list channel-list" role="listbox"></div>
            </section>

            <section id="epg-popover" class="epg-popover" aria-label="节目单" aria-live="polite">
              <div class="epg-heading">
                <p class="eyebrow">节目单</p>
                <strong id="epg-channel-title">当前频道</strong>
              </div>
              <div id="epg-program-list" class="epg-program-list"></div>
            </section>
          </div>
        </aside>

        <div class="now-playing">
          <div class="now-playing-copy">
            <p class="eyebrow">正在播放</p>
            <h2 id="now-playing-title">正在载入频道…</h2>
            <p id="now-playing-group">按 → 浏览频道库</p>
            <div class="now-playing-program">
              <div class="now-playing-program-line">
                <span id="now-playing-program-title" class="now-playing-program-title">暂无当前节目信息</span>
                <span id="now-playing-program-time" class="now-playing-program-time"></span>
              </div>
              <div
                id="now-playing-progress"
                class="now-playing-progress"
                role="progressbar"
                aria-label="当前节目进度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <span id="now-playing-progress-value"></span>
              </div>
            </div>
          </div>
          <div class="now-playing-badge"><span class="live-pulse" aria-hidden="true"></span><span>LIVE</span></div>
        </div>

        <footer>
          <span class="hint"><kbd>→</kbd><span>频道库</span></span>
          <span class="hint"><kbd>↑</kbd><kbd>↓</kbd><span>换台 / 选择</span></span>
          <span class="hint"><kbd>OK</kbd><span id="ok-hint-label">播放</span></span>
          <span class="hint"><kbd>BACK</kbd><span>返回</span></span>
        </footer>

        <section id="source-form-overlay" class="source-form-overlay" aria-label="播放源设置" aria-hidden="true">
          <div class="source-form-card">
            <p class="eyebrow">播放源</p>
            <h2 id="source-form-title">添加播放源</h2>
            <p id="source-form-subtitle" class="source-form-subtitle">添加一个电视可访问的 M3U 地址</p>
            <div class="source-form-fields">
              <label class="source-field">
                <span>名称（可选）</span>
                <input id="source-name-input" type="text" maxlength="60" autocomplete="off" placeholder="例如：家庭 IPTV" />
              </label>
              <label class="source-field">
                <span>M3U 地址（必填）</span>
                <input id="source-url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://server/playlist.m3u" />
              </label>
            </div>
            <p id="source-form-error" class="source-form-error" role="alert" hidden></p>
            <div class="source-form-actions">
              <button id="source-save-button" class="source-form-button is-primary" type="button">添加并播放</button>
              <button id="source-cancel-button" class="source-form-button" type="button">取消</button>
              <button id="source-delete-button" class="source-form-button is-danger" type="button" hidden>删除播放源</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="features/sources/source-store.js?v=0.1.0"></script>
    <script src="features/sources/source-form.js?v=0.1.0"></script>
    <script src="features/channels/channel-browser-state.js?v=0.3.0"></script>
    <script src="interaction.js?v=0.3.0"></script>
    <script src="features/channels/channel-panel.js?v=0.3.0"></script>
    <script src="app.js?v=0.3.0"></script>
  </body>
</html>
