name: Release webOS app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Validate tag and app versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./appinfo.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$app_version"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: pnpm test

      - name: Build webOS app
        run: pnpm build

      - name: Package IPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ares-package dist -o release
          ipk_path="$(find release -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$ipk_path"
          ipk_name="$(basename "$ipk_path")"
          version="${GITHUB_REF_NAME#v}"
          sha256="$(sha256sum "$ipk_path" | awk '{print $1}')"
          manifest="release/com.odyssey.webos.iptv.manifest.json"
          RELEASE_VERSION="$version" \
          IPK_NAME="$ipk_name" \
          IPK_SHA256="$sha256" \
          RELEASE_TAG="$GITHUB_REF_NAME" \
          node -e '
            const fs = require("fs");
            const version = process.env.RELEASE_VERSION;
            const ipkName = process.env.IPK_NAME;
            const sha256 = process.env.IPK_SHA256;
            const tag = process.env.RELEASE_TAG;
            const manifest = {
              id: "com.odyssey.webos.iptv",
              version,
              type: "web",
              title: "IPTV for webOS",
              appDescription: "A lightweight IPTV player for user-provided legal M3U playlists.",
              iconUri: "https://raw.githubusercontent.com/ladepensy/IPTV-for-webOS/main/largeIcon.png",
              sourceUrl: "https://github.com/ladepensy/IPTV-for-webOS",
              rootRequired: false,
              ipkUrl: `https://github.com/ladepensy/IPTV-for-webOS/releases/download/${tag}/${ipkName}`,
              ipkHash: {sha256}
            };
            fs.writeFileSync("release/com.odyssey.webos.iptv.manifest.json", JSON.stringify(manifest, null, 2) + "\\n");
          '
          printf '%s  %s\n' "$sha256" "$ipk_name" > "$ipk_path.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.ipk
            release/*.ipk.sha256
            release/*.manifest.json
          body: |
            This release was built from `${{ github.ref_name }}`.

            IPTV sources, channels, programme data, and media are not bundled.
            Users are responsible for providing sources they are legally authorized to access.
