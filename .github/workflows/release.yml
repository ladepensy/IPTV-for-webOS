name: Release webOS app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Validate tag and app versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(node -p "require('./appinfo.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$app_version"
          test "$tag_version" = "$package_version"

      - name: Run tests
        run: pnpm test

      - name: Build webOS app
        run: pnpm build

      - name: Package IPK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ares-package dist -o release
          ipk_path="$(find release -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$ipk_path"
          sha256sum "$ipk_path" > "$ipk_path.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.ipk
            release/*.ipk.sha256
          body: |
            This release was built from `${{ github.ref_name }}`.

            IPTV sources, channels, programme data, and media are not bundled.
            Users are responsible for providing sources they are legally authorized to access.
